$kind: http-request
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user@memes.local"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.resetToken) pm.collectionVariables.set('resetToken', json.resetToken);
    language: text/javascript
order: 11000
