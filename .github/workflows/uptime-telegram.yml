name: MemeHub uptime alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memehub-uptime-monitor
  cancel-in-progress: false

jobs:
  check-api:
    name: Check backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: .github/uptime-state/status
          key: memehub-uptime-state-${{ github.run_id }}
          restore-keys: |
            memehub-uptime-state-

      - name: Check health endpoint and track status changes
        id: monitor
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set the BACKEND_HEALTH_URL repository variable to the Render /health URL."
            exit 1
          fi

          state_file=".github/uptime-state/status"
          mkdir -p "$(dirname "$state_file")"
          old_status="unknown"
          if [ -f "$state_file" ]; then
            IFS= read -r old_status < "$state_file" || true
            if [ "$old_status" != "up" ] && [ "$old_status" != "down" ]; then
              old_status="unknown"
            fi
          fi

          response_file="$(mktemp)"
          if http_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$HEALTH_URL")"; then
            curl_exit=0
          else
            curl_exit=$?
            http_code="000"
          fi

          if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ] \
            && node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(JSON.parse(s).status==="ok"?0:1)}catch{process.exit(1)}})' < "$response_file"; then
            new_status="up"
          else
            new_status="down"
          fi
          rm -f "$response_file"

          printf '%s\n' "$new_status" > "$state_file"

          notify="false"
          status_changed="false"
          message=""
          if [ "$old_status" != "$new_status" ]; then
            status_changed="true"
            if [ "$new_status" = "down" ]; then
              notify="true"
              message="$(printf 'MemeHub API недоступен\nURL: %s\nHTTP: %s\nПроверка: %s/%s/actions/runs/%s' \
                "$HEALTH_URL" "$http_code" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            elif [ "$old_status" = "down" ]; then
              notify="true"
              message="$(printf 'MemeHub API восстановлен\nURL: %s\nHTTP: %s\nПроверка: %s/%s/actions/runs/%s' \
                "$HEALTH_URL" "$http_code" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            fi
          fi

          {
            echo "notify=${notify}"
            echo "status_changed=${status_changed}"
            echo "new_status=${new_status}"
            echo "message<<EOF"
            printf '%s\n' "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send status change to Telegram
        if: steps.monitor.outputs.notify == 'true'
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.monitor.outputs.message }}

      - name: Save status after a change
        if: steps.monitor.outputs.status_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .github/uptime-state/status
          key: memehub-uptime-state-${{ github.run_id }}
