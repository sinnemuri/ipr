name: MemeHub uptime alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: memehub-uptime-monitor
  cancel-in-progress: false

jobs:
  check-api:
    name: Check backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check health endpoint and track status changes
        id: monitor
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set the BACKEND_HEALTH_URL repository variable to the Render /health URL."
            exit 1
          fi

          response_file="$(mktemp)"
          if http_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$HEALTH_URL")"; then
            curl_exit=0
          else
            curl_exit=$?
            http_code="000"
          fi

          if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ] \
            && node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(JSON.parse(s).status==="ok"?0:1)}catch{process.exit(1)}})' < "$response_file"; then
            new_status="up"
          else
            new_status="down"
          fi
          rm -f "$response_file"

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/MEMEHUB_API_STATUS"
          api_response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" "$api_url")"
          api_code="${api_response##*$'\n'}"
          api_body="${api_response%$'\n'*}"

          if [ "$api_code" = "200" ]; then
            old_status="$(printf '%s' "$api_body" | jq -r '.value')"
          elif [ "$api_code" = "404" ]; then
            old_status="unknown"
          else
            echo "::error::Could not read the uptime state variable (GitHub API HTTP ${api_code})."
            exit 1
          fi

          if [ "$old_status" != "$new_status" ]; then
            payload="$(jq -cn --arg value "$new_status" '{value:$value}')"
            if [ "$api_code" = "404" ]; then
              write_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables"
              payload="$(jq -cn --arg name "MEMEHUB_API_STATUS" --arg value "$new_status" '{name:$name,value:$value}')"
              expected_code="201"
            else
              write_url="$api_url"
              expected_code="204"
            fi

            write_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request "$( [ "$api_code" = "404" ] && printf POST || printf PATCH )" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$payload" "$write_url")"
            if [ "$write_code" != "$expected_code" ]; then
              echo "::error::Could not save the uptime state variable (GitHub API HTTP ${write_code})."
              exit 1
            fi
          fi

          notify="false"
          message=""
          if [ "$old_status" != "$new_status" ]; then
            if [ "$new_status" = "down" ]; then
              notify="true"
              message="$(printf 'MemeHub API недоступен\nURL: %s\nHTTP: %s\nПроверка: %s/%s/actions/runs/%s' \
                "$HEALTH_URL" "$http_code" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            elif [ "$old_status" = "down" ]; then
              notify="true"
              message="$(printf 'MemeHub API восстановлен\nURL: %s\nHTTP: %s\nПроверка: %s/%s/actions/runs/%s' \
                "$HEALTH_URL" "$http_code" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            fi
          fi

          {
            echo "notify=${notify}"
            echo "message<<EOF"
            printf '%s\n' "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send status change to Telegram
        if: steps.monitor.outputs.notify == 'true'
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.monitor.outputs.message }}
